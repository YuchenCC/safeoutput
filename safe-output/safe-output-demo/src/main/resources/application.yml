safe-output:
  rules:
    - name: demoRealName
      keys:
        - realName
      type: CHINESE_NAME
  ignore:
    keys:
      - plainNote
    apis:
      - method: GET
        path: /demo/ignored
        reason: demo plaintext endpoint
  report:
    enabled: true
    directory: target/safe-output-demo-reports
    file-prefix: demo-report
    interval-millis: 600000
  log:
    regex-fallback:
      enabled: true
