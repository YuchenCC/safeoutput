safe-output:
  rules:
    - name: demoRealName
      keys:
        - realName
      type: CHINESE_NAME
    - name: demoPhoneNo
      keys:
        - phoneNo
      type: MOBILE
    - name: demoAddress
      keys:
        - shippingAddress
      type: ADDRESS
    - name: demoDefault
      keys:
        - securityAnswer
      type: DEFAULT
  ignore:
    keys:
      - plainNote
    apis:
      - method: GET
        path: /demo/ignored
        reason: demo plaintext endpoint
      - method: GET
        path: /demo/business/legacy-plaintext
        reason: legacy plaintext integration contract
  report:
    enabled: true
    directory: target/safe-output-demo-reports
    file-prefix: demo-report
    interval-millis: 600000
  log:
    regex-fallback:
      enabled: true
